<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../global.css">
    <link rel="stylesheet" href="./login.css">
</head>

<body>

    <header>
        <h1>Login</h1>
    </header>

    <nav>
        <a href="../index.html">Home</a>
        <a href="./Login.html">Entrar</a>
        <a href="./Cadastro.html">Cadastrar</a>
    </nav>

    <main>
        <section class="conteudo-login">
            <img src="../Assets/login.png" alt="Ilustração de login">

            <form id="formLogin">
                <label for="inputLogin">E-mail</label>
                <input id="inputLogin" required type="email" placeholder="Digite seu e-mail">

                <label for="inputSenha">Senha</label>
                <input id="inputSenha" required type="password" placeholder="Digite sua senha">

                <button type="submit">Entrar</button>
            </form>

            <div class="links-login">
                <a href="./RecuperacaoDeSenhas.html">Esqueci minha senha</a>
                <p>Não tem cadastro? <a href="./Cadastro.html">Cadastre-se</a></p>
            </div>
        </section>
    </main>

    <footer>
        <h3>Endereço</h3>
        <ul>
            <li>Av. da Saudade, 125 - Ponte Preta, Campinas/SP.</li>
            <li>Telefone: (19) 3731-2840.</li>
            <li>Próximo à Rua Doutor Álvaro Ribeiro.</li>
        </ul>
        <img width="80" src="../Assets/senai.jpg" alt="Logo do Senai">
    </footer>

    
  <script src="login.js"></script>
</body>

</html>
